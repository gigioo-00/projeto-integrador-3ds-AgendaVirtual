<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="infos-tela-de-cima">
        <h1 class="NovoCadastro"><a href="../login/login.html"><i class="bi bi-arrow-left-circle icone-voltar"></i></a>Novo Cadastro</h1>
        <p class="textinho">Luláticos</p>
        <p class="textinho2">Agenda Virtual</p>
    </div>

    <div class="infos-tela-de-baixo">
        <form id="form-cadastro" class="formulario-container">

            <p class="textinho4">Insira seu nome:</p>
            <input type="text" id="nome" class="campo-nome" placeholder="Nome">
            <p class="textinho4">E-mail Institucional:</p>
            <input type="email" id="email" class="campo-email" placeholder="E-mail">
            <p class="textinho4">Senha:</p>
            <input type="password" id="senha" class="campo-senha" placeholder="Senha">
            <p class="textinho4">Confirmar Senha:</p>
            <input type="password" id="confirmarSenha" class="campo-senha" placeholder="Confirme sua senha">

            <button type="submit" class="botao-enviar">Cadastrar-se</button>
        </form>
    </div>


    <script src="./script.js"></script>
</body>

</html>

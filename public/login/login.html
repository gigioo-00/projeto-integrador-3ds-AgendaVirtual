<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="infos-tela-de-cima">
        <h1 class="FeedBack"><a class="link-feedback" href="../feedback/feedback1.html">✧ Feedback</a></h1>
        <p class="textinho">Luláticos</p>
        <p class="textinho2">Agenda Virtual</p>
    </div>
    <div class="infos-tela-de-baixo">
        <form id="form-login" class="formulario-container">
            <input type="email" id="email" class="campo-email" placeholder="E-mail">
            <input type="password" id="senha" class="campo-senha" placeholder="Senha">
            <button type="submit" class="botao-enviar">Acessar</button>
        </form>
    </div>
    <div class="infos-tela-de-baixo-2">
        <p class="textinho3">Não possui uma conta? <a class="link-cadastro" href="../cadastro/cadastro.html">Cadastre-se</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>FeedBack</title>
</head>

<body>

    <div class="tela-dividida">
        <div class="metade-cima"></div>
    </div>

    <div class="infos-tela-de-cima">
        <h1 class="FeedBack">
            <a href="feedback1.html" class="link-voltar">
                <i class="bi bi-arrow-left-circle icone-voltar"></i>Voltar
            </a>
        </h1>
        <h1 class="BemVindo">AVISO!</h1>
        <p class="textinho">Comentários indecentes, desrespeitosos ou que violem direitos humanos não serão tolerados.
            Respeite as diretrizes da plataforma. Esta é uma área séria e deve ser usada com responsabilidade.</p>
    </div>

    <div class="infos-tela-de-baixo">
        <form class="formulario-container" id="formFeedback">
            <textarea id="texto" class="campo-email" placeholder="Digite sua mensagem..." required></textarea>
            <button type="submit" class="botao-enviar">Enviar</button>
        </form>
        <div id="resultadoFeedback"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./feedback2.js"></script>

</body>

</html>

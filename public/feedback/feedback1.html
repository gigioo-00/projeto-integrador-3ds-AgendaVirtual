<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>FeedBack</title>
</head>

<body>

    <div class="tela-dividida">
        <div class="metade-cima"></div>
    </div>

    <div class="infos-tela-de-cima">
        <h1 class="FeedBack"><i class="bi bi-arrow-left-circle icone-voltar"></i>FeedBack</h1>
        <h1 class="BemVindo">Bem-Vindo(a)!</h1>
        <p class="textinho">Nossa área de feedbacks atua de forma imparcial e independente, analisando cada caso com
            cuidado, respeito e compromisso real com a melhoria contínua.</p>
    </div>

    <div class="infos-tela-de-baixo">
        <div class="textinho2">insira um e-mail de contato</div>

        <form class="formulario-container" id="formEmail">
            <input type="email" id="email" class="campo-email" placeholder="seuemail@exemplo.com" required>
            <button type="submit" class="botao-enviar">Continuar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./feedback1.js"></script>

</body>

</html>

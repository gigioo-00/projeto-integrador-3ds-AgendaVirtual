<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Aviso</title>
    <link rel="stylesheet" href="novo-aviso.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="novo-aviso.js"></script>
</head>

<body>

    <header class="header-topo"></header>

    <div class="infos-tela-de-cima">
        <h1 class="Editar">
            <a href="../login/login.html"><i class="bi bi-arrow-left-circle icone-voltar"></i></a>Novo Aviso
        </h1>
    </div>

    <div class="container-botoes espaco-botoes">
        <button type="button" id="btn-editar" class="btn btn-editar" title="Habilitar Edição"><i class="bi bi-pencil-square"></i></button>
        <button type="button" id="btn-deletar" class="btn btn-deletar" title="Excluir Aviso"><i class="bi bi-trash-fill"></i></button>
        <button type="button" id="btn-confirmar" class="btn btn-confirmar" title="Confirmar Modificações"><i class="bi bi-check-lg"></i></button>
    </div>

    <div class="card-aviso escuro">
        <div class="campo-data-wrapper">
            <label for="data-aviso" class="label-data">Data do Aviso:</label>
            <input type="date" id="data-aviso" class="input-data">
        </div>

        <textarea id="texto-aviso" class="textarea-conteudo" placeholder="Escreva o conteúdo de aviso aqui..."></textarea>
    </div>

</body>

</html>
